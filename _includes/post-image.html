{%- assign image_path = include.post.image.path | default: include.post.image -%}
{%- if include.post.image_variants -%}
  {%- assign variants_path = '/assets/img/blog/responsive/' | append: include.post.image_variants | relative_url -%}
<picture class="post-picture">
  <source type="image/webp"
    srcset="{{ variants_path }}-320.webp 320w, {{ variants_path }}-768.webp 768w, {{ variants_path }}-1440.webp 1440w"
    sizes="{{ include.sizes | default: '(max-width: 610px) calc(100vw - 90px), (max-width: 970px) 520px, 560px' }}">
{%- endif %}
  <img class="{{ include.image_class | default: 'post-img' }}" src="{{ image_path | relative_url }}"
    alt="{% unless include.decorative %}{{ include.post.image_alt | escape }}{% endunless %}"
    {% if include.post.image.width and include.post.image.height %}width="{{ include.post.image.width }}" height="{{ include.post.image.height }}"{% endif %}
    {% if include.loading %}loading="{{ include.loading }}"{% endif %}
    {% if include.priority %}fetchpriority="high"{% endif %}>
{%- if include.post.image_variants %}
</picture>
{%- endif %}
