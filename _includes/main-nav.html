<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} home">
      <img class="site-logo" src="{{ '/assets/img/bearded-dragon-owners.png' | relative_url }}" alt="" width="92" height="92">
      <img class="site-logo site-logo-hover" src="{{ '/assets/img/bearded-dragon-owners-hover.png' | relative_url }}" alt="" width="92" height="92">
    </a>
    <nav aria-label="Primary">
      {% if page.url == '/bearded-dragon-care-guide.html' %}
        <a href="{{ '/' | relative_url }}">Blog</a>
      {% else %}
        <a href="{{ '/bearded-dragon-care-guide.html' | relative_url }}">Care Guide</a>
      {% endif %}
    </nav>
  </div>
</header>
